    {% if not ace_already_loaded %}
        <script type="text/javascript" src="{{ ACE_URL }}/ace.js"></script>
    {% endif %}
    <script type="text/javascript">
        if (window.ace && ace.config) {
            ace.config.set('basePath', {{ ACE_URL|tojson }});
            ace.config.set('modePath', {{ ACE_URL|tojson }});
            ace.config.set('themePath', {{ ACE_URL|tojson }});
            ace.config.set('workerPath', {{ ACE_URL|tojson }});
        }
    </script>
    {{ form.media.js }}
    {% compress js %}
        <script type="text/javascript">
            $(function () {
                var panelInitialized = false;
                var templateReqSeq = 0;
                var applyingTemplate = false;
                var userEdited = false;
                var savedCodeDraft = '';

                function format(state) {
                    if (!state.id) return state.text; // optgroup
                    return state.text;
                }

                window.previous_template = '';

                function safeGetStorage(key) {
                    try {
                        return localStorage.getItem(key);
                    } catch (err) {
                        return null;
                    }
                }

                function safeSetStorage(key, val) {
                    try {
                        localStorage.setItem(key, val);
                    } catch (err) {
                        // ignore storage quota/privacy errors
                    }
                }

                function isCurrentLangFileOnly() {
                    var obj = document.getElementById('id_language');
                    if (!obj || obj.selectedIndex < 0) return false;
                    return obj.options[obj.selectedIndex].getAttribute('data-fileonly') === 'True';
                }

                function update_language_template() {
                    if (isCurrentLangFileOnly()) return;
                    var source = $('textarea#id_source');
                    var currentVal = source.val() || '';
                    if (userEdited && currentVal !== '') return;
                    if (currentVal === window.previous_template.replace(/\r/g, '') || currentVal === '') {
                        var lang_id = $('#id_language').val();
                        var reqSeq = ++templateReqSeq;
                        var cachedCode = safeGetStorage('submit:' + lang_id);

                        function update_submit_area(code) {
                            if (reqSeq !== templateReqSeq) return;
                            if ($('#id_language').val() !== lang_id || isCurrentLangFileOnly()) return;
                            var latestVal = source.val() || '';
                            if (userEdited && latestVal !== '') return;
                            if (latestVal !== '' && latestVal !== window.previous_template.replace(/\r/g, '')) return;
                            applyingTemplate = true;
                            window.previous_template = code || '';
                            source.val(window.previous_template);
                            if (window.ace_source) {
                                window.ace_source.getSession().setValue(window.previous_template);
                            }
                            applyingTemplate = false;
                        }

                        if (cachedCode != null) {
                            update_submit_area(cachedCode);
                        } else {
                            $.get('{{ url('language_template_ajax') }}', {
                                id: lang_id
                            }).done(function (template) {
                                update_submit_area(template);
                            });
                        }
                    }
                }

                function makeDisplayData(data) {
                    var site_data = data.attr('data-info');
                    var judge_data = data.attr('data-judge-info');
                    return site_data || judge_data || '';
                }

                function formatSelection(state) {
                    if (!state.id) return state.text; // optgroup
                    var data = makeDisplayData($('option[data-id="' + state.id + '"]'));
                    return $('<span>').append($('<b>').text(state.text), ' (', document.createTextNode(data), ')');
                }

                function renderDefaultFilePrompt(fileExt, fileSizeLimit) {
                    var $drag = $('#file_drag').empty();
                    $drag.append(
                        $('<b>').text('{{ _("Click to select a file or drag a file into this box") }}'),
                        $('<br>'),
                        document.createTextNode(
                            '{{ _("Only accept") }} "' + fileExt + '". ' +
                            '{{ _("Maximum file size is") }} ' + fileSizeLimit + 'MB.'
                        )
                    );
                }

                function resizeAceEditor() {
                    var $ace = $('#ace_source');
                    if (!$ace.length) return;
                    $ace.height(Math.max($(window).height() - 353, 240));
                    if (window.ace_source) {
                        window.ace_source.resize();
                    }
                }

                function on_language_change() {
                    var obj = document.getElementById('id_language');
                    if (!obj || obj.selectedIndex < 0) return;
                    var selectedOpt = obj.options[obj.selectedIndex];
                    var fileonly = selectedOpt.getAttribute('data-fileonly');
                    var $source = $('textarea#id_source');
                    var $fileUpload = $('#file_upload');

                    if (fileonly === 'True') {
                        if (!$source.prop('disabled')) {
                            savedCodeDraft = window.ace_source ? window.ace_source.getSession().getValue() : ($source.val() || '');
                        }
                        $('#editor').addClass('hidden');
                        $('#file-submit').removeClass('hidden');
                        $source.prop('disabled', true);
                        $fileUpload.prop('disabled', false);

                        var file_ext = '.' + (selectedOpt.getAttribute('data-ext') || '');
                        var file_size_limit = selectedOpt.getAttribute('data-file-size') || '';
                        $fileUpload.val('');
                        $fileUpload.attr({accept: file_ext});
                        renderDefaultFilePrompt(file_ext, file_size_limit);
                    } else {
                        $('#editor').removeClass('hidden');
                        $('#file-submit').addClass('hidden');
                        $fileUpload.val('').prop('disabled', true);
                        $source.prop('disabled', false);

                        if (savedCodeDraft && !$source.val()) {
                            applyingTemplate = true;
                            $source.val(savedCodeDraft);
                            if (window.ace_source) {
                                window.ace_source.getSession().setValue(savedCodeDraft);
                            }
                            applyingTemplate = false;
                        }

                        var aceMode = selectedOpt.getAttribute('data-ace');
                        if (window.ace_source && aceMode) {
                            window.ace_source.getSession().setMode('ace/mode/' + aceMode);
                        }
                        resizeAceEditor();
                    }
                }

                function bindAceLoadHandler() {
                    $('#ace_source').off('ace_load.problemSubmit').on('ace_load.problemSubmit', function (e, editor) {
                        editor.getSession().on('change', function () {
                            if (!applyingTemplate) {
                                userEdited = true;
                                savedCodeDraft = editor.getSession().getValue();
                            }
                        });

                        if ($('textarea#id_source').val()) {
                            userEdited = true;
                            savedCodeDraft = $('textarea#id_source').val();
                        } else {
                            update_language_template();
                        }

                        editor.commands.addCommand({
                            name: 'save',
                            bindKey: {win: 'Ctrl-S', mac: 'Command-S'},
                            exec: function () {
                                safeSetStorage('submit:' + $('#id_language').val(), editor.getSession().getValue());
                            }
                        });
                        editor.commands.addCommand({
                            name: 'open',
                            bindKey: {win: 'Ctrl-O', mac: 'Command-O'},
                            exec: function () {
                                $('#file_select').click();
                            }
                        });
                        editor.getSession().setUseWrapMode(true);
                        editor.setFontSize(14);
                        editor.setPrintMarginColumn(100);

                        $(editor.container).on('dragover', function (ev) {
                            var types = ev.originalEvent.dataTransfer.types;
                            if (types && Array.prototype.indexOf.call(types, 'Files') !== -1) {
                                ev.stopPropagation();
                                ev.preventDefault();
                            }
                        });

                        $(editor.container).on('drop', function (ev) {
                            ev.preventDefault();
                            $('#file_select').prop('files', ev.originalEvent.dataTransfer.files);
                            handleFileSelect();
                        });

                        on_language_change();
                        resizeAceEditor();
                    });
                }

                window.initProblemSubmitPanel = function () {
                    if (!$('#problem_submit').length || !$('#id_language').length) return;
                    if (panelInitialized) {
                        resizeAceEditor();
                        return;
                    }
                    panelInitialized = true;

                    // Terrible hack, adapted from https://github.com/select2/select2/issues/4436
                    if ($.fn.select2 && $.fn.select2.amd) {
                        var customAdapter;
                        try {
                            customAdapter = $.fn.select2.amd.require('select2/data/customAdapter');
                        } catch (err) {
                            $.fn.select2.amd.define('select2/data/customAdapter', ['select2/results', 'select2/utils'], function (Result, Utils) {
                                var RefPresenter = function ($element, options, dataAdapter) {
                                    RefPresenter.__super__.constructor.call(this, $element, options, dataAdapter);
                                };
                                Utils.Extend(RefPresenter, Result);
                                RefPresenter.prototype.bind = function (container, $container) {
                                    container.on('results:focus', function (params) {
                                        var data = makeDisplayData($('option[data-id="' + params.data.id + '"]'));
                                        $('#result-version-info').text(data);
                                    });
                                    RefPresenter.__super__.bind.call(this, container, $container);
                                };
                                return RefPresenter;
                            });
                            customAdapter = $.fn.select2.amd.require('select2/data/customAdapter');
                        }

                        $('#id_language').select2({
                            theme: '{{ DMOJ_SELECT2_THEME }}',
                            width: '100%',
                            templateResult: format,
                            templateSelection: formatSelection,
                            resultsAdapter: customAdapter
                        });
                    }

                    $('#id_language').on('select2:open', function () {
                        var dropdown = $('.select2-dropdown');
                        if (!$('#result-version-info').length)
                            dropdown.append($('<span id="result-version-info">'));
                        dropdown.attr('id', 'language-select2');
                    });

                    $('#id_judge').on('select2:open', function () {
                        var dropdown = $('.select2-dropdown');
                        $('#result-version-info').remove();
                        dropdown.attr('id', 'judge-select2');
                    });

                    $('#id_language').on('change', function () {
                        on_language_change();
                        if (!isCurrentLangFileOnly()) {
                            update_language_template();
                        }
                    });

                    bindAceLoadHandler();

                    var aceWidget = document.getElementById('ace_source');
                    if (aceWidget && window.djangoAceInitWidget && window.ace) {
                        window.djangoAceInitWidget(aceWidget);
                    }

                    on_language_change();
                    resizeAceEditor();

                    $(window).on('resize.problemSubmit', resizeAceEditor);

                    function fileDragHover(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        if (e.type === 'dragover') {
                            $('#file_drag').addClass('hover');
                        } else {
                            $('#file_drag').removeClass('hover');
                        }
                    }

                    function fileDropHandler(e) {
                        fileDragHover(e);
                        $('#file_upload').prop('files', e.originalEvent.dataTransfer.files);
                        handleFileChange();
                    }

                    $('#file_drag').on('dragover', fileDragHover);
                    $('#file_drag').on('dragleave', fileDragHover);
                    $('#file_drag').on('drop', fileDropHandler);

                    $('#problem_submit').on('submit', function (event) {
                        if (isCurrentLangFileOnly()) {
                            var obj = document.getElementById('id_language');
                            var fileSizeLimit = parseFloat(obj.options[obj.selectedIndex].getAttribute('data-file-size'));
                            var fileInput = $('#file_upload')[0];
                            if (fileInput && fileInput.files && fileInput.files.length > 0 && fileSizeLimit > 0) {
                                var file = fileInput.files[0];
                                if (file.size > fileSizeLimit * 1024 * 1024) {
                                    alert("{{ _('Maximum file size is') }} " + fileSizeLimit + 'MB.');
                                    event.preventDefault();
                                    $('#problem_submit').find(':submit').attr('disabled', false);
                                }
                            }
                        } else {
                            var $source = $('#id_source');
                            if (window.ace_source) {
                                $source.val(window.ace_source.getSession().getValue());
                            }
                            if (($source.val() || '').length > 65536) {
                                alert("{{ _('Your source code must contain at most 65536 characters.') }}");
                                event.preventDefault();
                                $('#problem_submit').find(':submit').attr('disabled', false);
                            }
                        }
                    });
                };

                // Initialize immediately when standalone submit page or Submit tab is active.
                var $submitPanel = $('#submit-panel');
                if (!$submitPanel.length || $submitPanel.hasClass('active')) {
                    window.initProblemSubmitPanel();
                }

                window._onProblemFileLoaded = function (content) {
                    userEdited = true;
                    savedCodeDraft = content;
                    $('textarea#id_source').val(content);
                    if (window.ace_source) {
                        window.ace_source.getSession().setValue(content);
                    }
                };
            });

            function handleFileSelect() {
                var input = $('#file_select')[0];
                var file = input && input.files && input.files[0];
                if (file && window.FileReader) {
                    var reader = new FileReader();
                    reader.onload = function () {
                        if (window._onProblemFileLoaded) {
                            window._onProblemFileLoaded(reader.result);
                        } else if (window.ace_source) {
                            window.ace_source.session.setValue(reader.result);
                        }

                        if (file.name.indexOf('.') !== -1) {
                            var ext = file.name.split('.').pop();
                            var languages = $('#id_language')[0].options;
                            for (var i = languages.length - 1; i >= 0; i--) {
                                if (languages[i].getAttribute('data-fileonly') === 'False' && languages[i].getAttribute('data-ext') === ext) {
                                    $('#id_language').val(languages[i].value).change();
                                    break;
                                }
                            }
                        }
                    };
                    reader.readAsText(file);
                }
            }

            function handleFileChange() {
                var input = $('#file_upload')[0];
                var file = input && input.files && input.files[0];
                if (file) {
                    var $drag = $('#file_drag').empty();
                    $drag.append(
                        $('<b>').text('{{ _("File name") }}: '),
                        document.createTextNode(file.name),
                        $('<br>'),
                        $('<b>').text('{{ _("File size") }}: '),
                        document.createTextNode((file.size / (1024 * 1024)).toFixed(2) + ' MB')
                    );
                }
            }

            // https://stackoverflow.com/questions/43043113/how-to-force-reloading-a-page-when-using-browser-back-button#comment105570384_43043658
            if (!document.getElementById('submit-panel') && window.performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
                location.reload(true);
            }
        </script>
    {% endcompress %}
